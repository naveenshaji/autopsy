name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: CLI smoke
        run: |
          autopsy --help >/dev/null
          autopsy version --json
          autopsy doctor
          autopsy init --check >/dev/null
          autopsy instructions >/dev/null

      - name: Install matrix
        env:
          AUTOPSY_INSTALL_MATRIX_SKIP_RUNTIME: "1"
          PYTHON: python
        run: ./scripts/install-matrix-check.sh

      - name: Build wheel
        run: python -m build --wheel

  release-check:
    name: Release check (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-15
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Release check
        run: ./scripts/release-check.sh

  linux-install:
    name: Linux install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from checkout
        env:
          PYTHON: python
          AUTOPSY_INSTALL_PREFIX: ${{ runner.temp }}/autopsy-prefix
        run: ./scripts/install-global.sh

      - name: CPU-only torch
        run: |
          "$RUNNER_TEMP/autopsy-prefix/opt/autopsy-memory/venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          torch = metadata.version("torch")
          assert "+cpu" in torch, torch
          cuda = [name for name in (d.metadata["Name"] or "" for d in metadata.distributions()) if name.lower().startswith("nvidia-")]
          assert not cuda, cuda
          print("torch", torch)
          PY

      - name: Set up and smoke test
        env:
          AUTOPSY_APP_SUPPORT_DIR: ${{ runner.temp }}/autopsy-data
        run: |
          export PATH="$RUNNER_TEMP/autopsy-prefix/bin:$PATH"
          test "$(command -v autopsy)" = "$RUNNER_TEMP/autopsy-prefix/bin/autopsy"
          autopsy version --json
          autopsy install --smoke-test --skip-model-warmup > "$RUNNER_TEMP/install.json"
          python - "$RUNNER_TEMP/install.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload["workflow"]["complete"] is True, payload["workflow"]
          assert payload["menubar"]["reason"] == "unsupported_platform", payload["menubar"]
          assert payload["smoke_test"]["ok"] is True, payload["smoke_test"]
          PY

  homebrew-formula:
    name: Homebrew formula
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Prepare local tap
        run: |
          brew tap-new local/autopsy
          # Newer Homebrew refuses formulae from untrusted taps; older releases have no trust command.
          brew trust local/autopsy || true
          cp Formula/autopsy-memory.rb "$(brew --repository)/Library/Taps/local/homebrew-autopsy/Formula/autopsy-memory.rb"

      - name: Audit formula
        run: |
          brew style local/autopsy/autopsy-memory
          brew audit --formula --strict local/autopsy/autopsy-memory

      - name: Install formula from source
        run: brew install --build-from-source local/autopsy/autopsy-memory

      - name: Test formula
        run: brew test --force local/autopsy/autopsy-memory

  homebrew-current-source:
    name: Homebrew current source
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formula from current checkout archive
        env:
          AUTOPSY_HOMEBREW_CURRENT_INSTALL: "1"
        run: ./scripts/homebrew-current-check.sh
