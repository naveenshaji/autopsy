[package]
name = "autopsy-observatory"
version = "0.1.0"
description = "Cross-platform visual observability app for Autopsy memory."
edition = "2021"

[lib]
name = "autopsy_observatory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
